[workspace]
members = [
    "crates/celeste-core",
    "crates/celeste-names",
    "crates/celeste-engine",
    "crates/celeste-kernels",
    "native-probe",
]
# Without this, a bare `cargo build` in the repo root builds ONLY the root
# package, because the root is itself a package. native-probe depends on
# celeste-rust, so it is exactly the member a change to celeste-rust can
# break - and it broke silently that way once (`FrameEngine::step` lost two
# parameters and the probe kept its stale binary in target/, so three
# `cargo build --release`s and a green `nextest` all passed over a member
# that did not compile). Building it by default costs one extra link.
default-members = [
    ".",
    "crates/celeste-core",
    "crates/celeste-names",
    "crates/celeste-engine",
    "crates/celeste-kernels",
    "native-probe",
]

[package]
name = "celeste-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
celeste-core = { path = "crates/celeste-core" }
celeste-engine = { path = "crates/celeste-engine" }
celeste-kernels = { path = "crates/celeste-kernels" }
celeste-names = { path = "crates/celeste-names" }
mimalloc = { version = "0.1", default-features = false }
anyhow = "1.0.62"
im = { version = "15.1.0", features = ["serde"] }
lazy_static = "1.4.0"
hex = "0.4.3"
rustc-hash = "1.1.0"
full_moon = "0.19.0"
itertools = "0.12.0"
indexmap = "2.2.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
elsa = "1.10"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[features]
# The fused specialization-set kernel (plans/shape-tag-plan.md). The
# artifact is generated per campaign by `transpile --fuse` (gitignored in
# celeste-kernels); building with this feature requires generating it
# first. Runtime opt-out: CELESTE_FUSED=0.
fused = ["celeste-kernels/fused"]

[[bin]]
name = "concrete_run"
path = "src/bin/concrete_run.rs"

[[bin]]
name = "measure_k"
path = "src/bin/measure_k.rs"

[[bin]]
name = "rewrite"
path = "src/bin/rewrite.rs"

[[bin]]
name = "lua_run"
path = "src/bin/lua_run.rs"

[profile.release]
lto = "fat"
codegen-units = 1
# unwind, not abort. The deopt path is BUILT on catching panics - a
# speculated instruction can assert on values the verify horizon never
# showed it, and run_deopt_frame_granular catches that and re-runs the
# state under the plain program. Under `abort` that catch_unwind is a
# no-op and such a panic kills the process instead, which is how a
# multi-hour room (0,0) campaign died at frame 66 on a one-line bug.
# Measured cost of unwinding: 2.2% (10.26 -> 10.48 s at 55 frames).
panic = "unwind"
# Frame pointers + line tables so `perf` can attribute cycles to source.
# Costs nothing measurable for the interpreter and makes the profile
# readable - but it is NOT free on the compiled path, see below.
debug = 1

# The compiled path opts out of debuginfo, and this is measured, not
# inherited superstition. On the f35 one-frame bench (30 reps, min):
# 103.6 ms with these overrides, 109.9 ms without - +6.1% for line tables
# over the kernels and the row machinery.
#
# The probe used to get this by being outside the workspace with its own
# `[profile]`; cargo ignores member profiles, which is the conflict that
# deferred this split under task #133. Per-package overrides at the root
# are the resolution, and they also keep an escape hatch for the original
# reason the probe wanted `debug = false`: LLVM's DWARF variable-DIE pass
# SEGVs on fused generated functions with thousands of locals. That crash
# is gone with the 29k-line transpiled body (K4 stage 4), so today this is
# purely the 6%.
[profile.release.package.celeste-engine]
debug = false
[profile.release.package.celeste-kernels]
debug = false
[profile.release.package.native-probe]
debug = false

[[bin]]
name = "transpile"
path = "src/bin/transpile.rs"
