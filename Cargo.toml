[workspace]
members = [
    "crates/celeste-core",
    "crates/celeste-names",
    "crates/celeste-engine",
]
# Build every member by default: the root is itself a package, so a bare
# `cargo build` would otherwise build only it.
default-members = [
    ".",
    "crates/celeste-core",
    "crates/celeste-names",
    "crates/celeste-engine",
]

[package]
name = "celeste-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
celeste-core = { path = "crates/celeste-core" }
celeste-engine = { path = "crates/celeste-engine" }
celeste-names = { path = "crates/celeste-names" }
mimalloc = { version = "0.1", default-features = false }
# `mi_option_set`: the kernel build's purge delay (`compiled::asm_kernel`).
libmimalloc-sys = { version = "0.1.44", features = ["extended"] }
anyhow = "1.0.62"
rustc-hash = "1.1.0"
# 2.x for the graph's intern table only (`transpile::graph::Graph`): 1.1's
# Fx ends in a bare multiply, and hashbrown indexes by the low bits.
rustc-hash2 = { package = "rustc-hash", version = "2.1.3" }
full_moon = "0.19.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"
memmap2 = "0.9"

[[bin]]
name = "concrete_run"
path = "src/bin/concrete_run.rs"

[[bin]]
name = "rewrite"
path = "src/bin/rewrite.rs"

# The edit-loop profile: optimized enough for compute-bound tests, without
# release's fat-LTO full-workspace relink on every edit. Never make the
# release profile cheaper to speed the loop up (every number in
# BENCHMARK_DATA.md was measured under it); add to this one.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
# Line tables so `perf` can attribute cycles to source.
debug = 1

# The engine crate opts out of debuginfo: line tables over the row machinery
# measured ~6% slower. Member profiles are ignored by cargo, so the override
# lives here.
[profile.release.package.celeste-engine]
debug = false

[[bin]]
name = "transpile"
path = "src/bin/transpile.rs"
