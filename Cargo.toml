[package]
name = "celeste-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
bv = "0.11.1"
anyhow = "1.0.62"
im = { version = "15.1.0", features = ["serde"] }
lazy_static = "1.4.0"
regex = "1.6.0"
hex = "0.4.3"
rustc-hash = "1.1.0"
work-queue = "0.1.3"
crossbeam = "0.8.2"
image = "0.24.3"
full_moon = "0.19.0"
itertools = "0.12.0"
petgraph = "0.6.5"
indexmap = "2.2.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
zstd = "0.13"
elsa = "1.10"

[[bin]]
name = "view_frames"
path = "src/bin/view_frames.rs"

[[bin]]
name = "compare_frames"
path = "src/bin/compare_frames.rs"

[[bin]]
name = "concrete_run"
path = "src/bin/concrete_run.rs"

[[bin]]
name = "measure_k"
path = "src/bin/measure_k.rs"

[[bin]]
name = "rewrite"
path = "src/bin/rewrite.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
