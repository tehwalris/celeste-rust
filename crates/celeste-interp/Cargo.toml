[package]
name = "celeste-interp"
version = "0.1.0"
edition = "2021"

[dependencies]
celeste-core = { path = "../celeste-core" }
celeste-ir = { path = "../celeste-ir" }
anyhow = "1.0.62"
im = { version = "15.1.0", features = ["serde"] }
lazy_static = "1.4.0"
rustc-hash = "1.1.0"
itertools = "0.12.0"
indexmap = "2.2.6"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
hex = "0.4.3"
elsa = "1.10"
zstd = "0.13"
memmap2 = "0.9"
bincode = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
