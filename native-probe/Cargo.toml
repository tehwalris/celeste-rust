# The bench/gate binary for the compiled engine (task #124, then #150).
#
# Thin by design: the block engine, the name tables and the generated
# kernels are workspace crates now (celeste-engine / celeste-names /
# celeste-kernels); what is left here is `--abstract`, `--abstract-bench`
# and the censuses that drive them.
#
# It is a WORKSPACE MEMBER, so it has no `[profile]` of its own - cargo
# ignores member profiles. That conflict is what deferred the split under
# task #133: the probe needed `debug = false` (LLVM's DWARF variable-DIE
# pass SEGVs on fused generated functions with thousands of locals) while
# the root wants `debug = 1` for perf line attribution. Two things
# resolved it. `[profile.release.package.NAME] debug = false` at the root
# is expressible (verified 2026-08-18), so the override is AVAILABLE if a
# kernel ever gets big enough to crash again - and it is not needed today,
# because the function that crashed was the 29k-line transpiled program
# body that K4 stage 4 deleted. Built clean under the root's `debug = 1`,
# 2026-08-18.
[package]
name = "native-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
celeste-core = { path = "../crates/celeste-core" }
celeste-engine = { path = "../crates/celeste-engine" }
celeste-kernels = { path = "../crates/celeste-kernels" }
celeste-names = { path = "../crates/celeste-names" }
celeste-rust = { path = ".." }
mimalloc = "0.1"
rustc-hash = "2.1.3"
serde_json = "1.0"
