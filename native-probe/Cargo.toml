# Native-compile probe (task #124): transpiled Celeste IR as plain Rust.
# `src/gen.rs` is GENERATED by `cargo run --release --bin transpile` in the
# parent repo and is gitignored; runtime.rs/main.rs are hand-written.
# Not a workspace member of the parent crate - build it from this directory.
[package]
name = "native-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
celeste-rust = { path = ".." }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# unwind: the gap census catches per-lane premise panics.
panic = "unwind"
# debug = 2 SIGSEGVs LLVM's DWARF variable-DIE pass on the rewritten
# program's fused functions (thousands of locals); line tables suffice
# for perf annotate - and debuginfo=1 crashed too, so it is off entirely.
debug = false
